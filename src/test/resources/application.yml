spring:
  datasource:
    url: jdbc:h2:mem:aiflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 16379

aiflow:
  audio:
    enabled: false
  dispatch:
    enabled: false
    worker-enabled: false
  safety:
    keywords:
      - 制作炸弹
  attachments:
    # 测试产物统一落 target/：不进仓库，也不用清 home 目录
    dir: target/test-attachments
  provider:
    mode: mock
  retrieval:
    embedding-store: memory
    cloud:
      enabled: false
